apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: syncopated1/log_output:1.8
          volumeMounts:
          - name: config
            mountPath: "usr/src/app/config"
            readOnly: true
      volumes:
          - name: config
            configMap:
              name: log-configmap
              items:
              - key: "information.txt"
                path: "information.txt"   