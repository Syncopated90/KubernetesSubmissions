apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: syncopated1/log_output:1.91
          envFrom:
          - configMapRef:
              name: log-urls-configmap
          volumeMounts:
          - name: config
            mountPath: "usr/src/app/config"
            readOnly: true
      volumes:
          - name: config
            configMap:
              name: log-configmap
              items:
              - key: "information.txt"
                path: "information.txt"  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-urls-configmap
  namespace: exercises
data:
  PINGPONG_URL: "http://pingpong-svc.exercises.svc.cluster.local:2345/pingpong"