apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-dep
  namespace: project
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      volumes:
        - name: image-pv
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo
          image: syncopated1/todo_app:1.12
          envFrom:
          - configMapRef:
              name: todo-configmap
          volumeMounts:
          - name: image-pv
            mountPath: /usr/src/app/static
