apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: syncopated1/todo_backend:1.4
          envFrom:
          - configMapRef:
              name: backend-configmap
          env:
            - name: DB_PASSWORD # ENV name passed to container
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: DB_PASSWORD # ENV name in the secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  namespace: project
data:
  PORT: "8000"
  DB_HOST: "todo-db-svc.project.svc.cluster.local"
  DB_NAME: "todo"
  DB_USER: "postgres"