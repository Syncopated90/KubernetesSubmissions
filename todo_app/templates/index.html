<!DOCTYPE html>
<html>
<head>
    <title>Todo with kubernetes</title>
    <style>
        h2, body {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2 >Welcome to the todo app</h2>
    <div><img src="{{image}}"></div>
    <div>
        Current todo's:
        {% for todo in todo_list %}
        <div>{{todo}}</div>
        {% endfor %}
    </div>
    <div><form method="POST">
        <input name="text" maxlength="140">
        <input type="submit">
    </form></div>
</body>
</html>
