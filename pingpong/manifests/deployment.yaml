apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
       - name: log-pv
         persistentVolumeClaim:
          claimName: log-claim
      containers:
        - name: pingpong
          image: syncopated1/pingpong:1.3
          volumeMounts:
           - name: log-pv
             mountPath: /usr/src/app/files