apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: syncopated1/pingpong:1.14
          envFrom:
          - configMapRef:
              name: pingpong-configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pingpong-configmap
  namespace: exercises
data:
  PORT: "8000"
  DB_HOST: "pingpong-db-svc.exercises.svc.cluster.local"
  DB_NAME: "pings"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"