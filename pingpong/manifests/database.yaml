apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-sts
  namespace: exercises
spec:
  serviceName: pingpong-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: pingpongdb
  template:
    metadata:
      labels:
        app: pingpongdb
    spec:
      containers:
        - name: pingpongdb
          image: postgres:19rc2-alpine
          envFrom:
          - configMapRef:
              name: db-configmap
          ports:
            - name: db
              containerPort: 5432
          volumeMounts:
            - name: postgres-data-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: db-storage-class
        resources:
          requests:
            storage: 100Mi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: db-storage-class  # e.g., premium-rwo-wait
provisioner: pd.csi.storage.gke.io   # Standard GKE CSI Driver
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: pd-balanced # Use pd-balanced or pd-ssd for databases

---
apiVersion: v1
kind: Service
metadata:
  name: pingpong-db-svc
  namespace: exercises
spec:
  ports:
  - port: 5555
    name: db
    targetPort: 5432
    protocol: TCP
  clusterIP: None
  selector:
   app: pingpongdb

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-configmap
  namespace: exercises
data:
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
